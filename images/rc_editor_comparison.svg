<svg xmlns="http://www.w3.org/2000/svg" width="900" viewBox="0 0 900 530">
<title>RC Exposition Editor Types</title>
<desc>Three side-by-side diagrams comparing Graphical, Block, and Markdown editor layouts in the Research Catalogue.</desc>
<rect x="0" y="0" width="900" height="530" fill="#ffffff"/>

<!-- HEADERS -->
<rect x="20" y="14" width="274" height="32" fill="#1D9E75"/>
<text font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff" x="157" y="30" text-anchor="middle" dominant-baseline="central">Graphical editor</text>
<rect x="318" y="14" width="244" height="32" fill="#534AB7"/>
<text font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff" x="440" y="30" text-anchor="middle" dominant-baseline="central">Block editor</text>
<rect x="586" y="14" width="294" height="32" fill="#993C1D"/>
<text font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff" x="733" y="30" text-anchor="middle" dominant-baseline="central">Markdown (text-based)</text>

<!-- DEFS -->
<defs>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
<line x1="0" y1="0" x2="0" y2="6" stroke="#0F6E56" stroke-width="1.2" stroke-opacity="0.22"/>
</pattern>
<marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
<path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="a2r" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto">
<path d="M8 1L2 5L8 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- GRAPHICAL PANEL -->
<!-- visible canvas area -->
<rect x="20" y="58" width="232" height="262" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5" stroke-dasharray="4 3"/>
<!-- overflow / beyond-screen zone (hatched) -->
<rect x="252" y="58" width="48" height="262" fill="url(#hatch)" stroke="#1D9E75" stroke-width="0.5" stroke-dasharray="4 3"/>
<!-- screen edge line -->
<line x1="252" y1="52" x2="252" y2="328" stroke="#0F6E56" stroke-width="1" stroke-dasharray="3 2"/>
<text font-family="sans-serif" font-size="9" fill="#0F6E56" x="254" y="51">screen edge</text>
<!-- label inside overflow zone -->
<text font-family="sans-serif" font-size="9" fill="#0F6E56" x="276" y="190" text-anchor="middle">extends</text>
<text font-family="sans-serif" font-size="9" fill="#0F6E56" x="276" y="201" text-anchor="middle">beyond &#x2192;</text>

<!-- grid dots -->
<g opacity="0.18">
<circle cx="40" cy="76" r="1.2" fill="#444"/><circle cx="70" cy="76" r="1.2" fill="#444"/><circle cx="100" cy="76" r="1.2" fill="#444"/><circle cx="130" cy="76" r="1.2" fill="#444"/><circle cx="160" cy="76" r="1.2" fill="#444"/><circle cx="190" cy="76" r="1.2" fill="#444"/><circle cx="220" cy="76" r="1.2" fill="#444"/><circle cx="250" cy="76" r="1.2" fill="#444"/>
<circle cx="40" cy="106" r="1.2" fill="#444"/><circle cx="70" cy="106" r="1.2" fill="#444"/><circle cx="100" cy="106" r="1.2" fill="#444"/><circle cx="130" cy="106" r="1.2" fill="#444"/><circle cx="160" cy="106" r="1.2" fill="#444"/><circle cx="190" cy="106" r="1.2" fill="#444"/><circle cx="220" cy="106" r="1.2" fill="#444"/><circle cx="250" cy="106" r="1.2" fill="#444"/>
<circle cx="40" cy="136" r="1.2" fill="#444"/><circle cx="70" cy="136" r="1.2" fill="#444"/><circle cx="100" cy="136" r="1.2" fill="#444"/><circle cx="130" cy="136" r="1.2" fill="#444"/><circle cx="160" cy="136" r="1.2" fill="#444"/><circle cx="190" cy="136" r="1.2" fill="#444"/><circle cx="220" cy="136" r="1.2" fill="#444"/><circle cx="250" cy="136" r="1.2" fill="#444"/>
<circle cx="40" cy="166" r="1.2" fill="#444"/><circle cx="70" cy="166" r="1.2" fill="#444"/><circle cx="100" cy="166" r="1.2" fill="#444"/><circle cx="130" cy="166" r="1.2" fill="#444"/><circle cx="160" cy="166" r="1.2" fill="#444"/><circle cx="190" cy="166" r="1.2" fill="#444"/><circle cx="220" cy="166" r="1.2" fill="#444"/><circle cx="250" cy="166" r="1.2" fill="#444"/>
</g>

<!-- freely positioned tools -->
<rect x="30" y="86" width="112" height="64" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#085041" x="86" y="118" text-anchor="middle" dominant-baseline="central">Image</text>
<rect x="108" y="132" width="88" height="44" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#2C2C2A" x="152" y="154" text-anchor="middle" dominant-baseline="central">Text</text>
<rect x="30" y="184" width="78" height="34" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#085041" x="69" y="201" text-anchor="middle" dominant-baseline="central">Audio</text>
<!-- video tool that crosses screen edge into overflow zone -->
<rect x="120" y="186" width="168" height="46" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#2C2C2A" x="204" y="209" text-anchor="middle" dominant-baseline="central">Video (wide tool)</text>
<rect x="30" y="240" width="68" height="34" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#2C2C2A" x="64" y="257" text-anchor="middle" dominant-baseline="central">Text</text>

<!-- unlimited width arrow -->
<line x1="26" y1="334" x2="294" y2="334" stroke="#0F6E56" stroke-width="0.8" marker-end="url(#a1)"/>
<text font-family="sans-serif" font-size="9" fill="#0F6E56" x="160" y="328" text-anchor="middle">unlimited canvas width</text>

<!-- traits -->
<text font-family="sans-serif" font-size="11" fill="#333333" x="157" y="360" text-anchor="middle">Free x/y positioning</text>
<text font-family="sans-serif" font-size="11" fill="#333333" x="157" y="378" text-anchor="middle">Infinite canvas — no width limit</text>
<text font-family="sans-serif" font-size="11" fill="#333333" x="157" y="396" text-anchor="middle">Tools can overlap</text>
<text font-family="sans-serif" font-size="11" fill="#bb3300" x="157" y="414" text-anchor="middle">Not responsive</text>
<text font-family="sans-serif" font-size="11" fill="#333333" x="157" y="432" text-anchor="middle">Drag and drop</text>

<!-- BLOCK EDITOR PANEL -->
<rect x="318" y="58" width="244" height="262" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<rect x="326" y="66" width="228" height="28" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#26215C" x="440" y="80" text-anchor="middle" dominant-baseline="central">Text block (full width)</text>
<rect x="326" y="102" width="110" height="52" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#2C2C2A" x="381" y="128" text-anchor="middle" dominant-baseline="central">Image</text>
<rect x="442" y="102" width="112" height="52" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#2C2C2A" x="498" y="128" text-anchor="middle" dominant-baseline="central">Text</text>
<rect x="326" y="162" width="228" height="36" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#26215C" x="440" y="180" text-anchor="middle" dominant-baseline="central">Image block (full width)</text>
<rect x="326" y="206" width="70" height="34" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#2C2C2A" x="361" y="223" text-anchor="middle" dominant-baseline="central">Img</text>
<rect x="402" y="206" width="72" height="34" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#2C2C2A" x="438" y="223" text-anchor="middle" dominant-baseline="central">Text</text>
<rect x="480" y="206" width="74" height="34" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#2C2C2A" x="517" y="223" text-anchor="middle" dominant-baseline="central">Audio</text>
<rect x="326" y="248" width="228" height="26" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#26215C" x="440" y="261" text-anchor="middle" dominant-baseline="central">Text block</text>
<!-- width double arrow -->
<line x1="318" y1="332" x2="562" y2="332" stroke="#534AB7" stroke-width="0.8" marker-start="url(#a2r)" marker-end="url(#a2)"/>
<text font-family="sans-serif" font-size="9" fill="#534AB7" x="440" y="326" text-anchor="middle">max column width (screen width)</text>
<!-- traits -->
<text font-family="sans-serif" font-size="11" fill="#333333" x="440" y="360" text-anchor="middle">Rows and columns layout</text>
<text font-family="sans-serif" font-size="11" fill="#333333" x="440" y="378" text-anchor="middle">Width-constrained column</text>
<text font-family="sans-serif" font-size="11" fill="#333333" x="440" y="396" text-anchor="middle">Height auto-fits content</text>
<text font-family="sans-serif" font-size="11" fill="#2a7a2a" x="440" y="414" text-anchor="middle">Fully responsive</text>
<text font-family="sans-serif" font-size="11" fill="#333333" x="440" y="432" text-anchor="middle">Same drag and drop tools</text>

<!-- MARKDOWN PANEL -->
<rect x="586" y="58" width="294" height="262" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<rect x="594" y="66" width="278" height="22" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#4A1B0C" x="733" y="77" text-anchor="middle" dominant-baseline="central"># Heading 1</text>
<rect x="594" y="96" width="262" height="7" fill="#c8c7c0"/>
<rect x="594" y="108" width="218" height="7" fill="#c8c7c0"/>
<rect x="594" y="120" width="248" height="7" fill="#c8c7c0"/>
<rect x="594" y="134" width="200" height="20" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#4A1B0C" x="694" y="144" text-anchor="middle" dominant-baseline="central">## Heading 2</text>
<rect x="594" y="160" width="270" height="7" fill="#c8c7c0"/>
<rect x="594" y="172" width="180" height="7" fill="#c8c7c0"/>
<rect x="594" y="186" width="278" height="20" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="10" fill="#2C2C2A" x="733" y="196" text-anchor="middle" dominant-baseline="central">![alt text](image.jpg)</text>
<rect x="600" y="214" width="6" height="6" fill="#888"/>
<rect x="612" y="214" width="148" height="6" fill="#c8c7c0"/>
<rect x="600" y="226" width="6" height="6" fill="#888"/>
<rect x="612" y="226" width="116" height="6" fill="#c8c7c0"/>
<rect x="600" y="238" width="6" height="6" fill="#888"/>
<rect x="612" y="238" width="180" height="6" fill="#c8c7c0"/>
<rect x="594" y="252" width="262" height="7" fill="#c8c7c0"/>
<rect x="594" y="264" width="140" height="7" fill="#c8c7c0"/>
<rect x="594" y="276" width="228" height="7" fill="#c8c7c0"/>
<rect x="594" y="288" width="90" height="7" fill="#c8c7c0"/>
<rect x="594" y="300" width="260" height="7" fill="#c8c7c0"/>
<!-- traits -->
<text font-family="sans-serif" font-size="11" fill="#333333" x="733" y="360" text-anchor="middle">Plain text source (Markdown)</text>
<text font-family="sans-serif" font-size="11" fill="#333333" x="733" y="378" text-anchor="middle">Headings, lists, links</text>
<text font-family="sans-serif" font-size="11" fill="#333333" x="733" y="396" text-anchor="middle">Inline media via tags</text>
<text font-family="sans-serif" font-size="11" fill="#2a7a2a" x="733" y="414" text-anchor="middle">Fully responsive</text>
<text font-family="sans-serif" font-size="11" fill="#333333" x="733" y="432" text-anchor="middle">Import / export (Word, LaTeX)</text>

<!-- COLUMN DIVIDERS -->
<line x1="308" y1="46" x2="308" y2="448" stroke="#aaaaaa" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="578" y1="46" x2="578" y2="448" stroke="#aaaaaa" stroke-width="0.5" stroke-dasharray="3 3"/>

<!-- LEGEND -->
<line x1="20" y1="450" x2="880" y2="450" stroke="#bbbbbb" stroke-width="0.5"/>
<rect x="20" y="464" width="12" height="12" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#333" x="38" y="473" dominant-baseline="central">Media tool</text>
<rect x="148" y="464" width="12" height="12" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#333" x="166" y="473" dominant-baseline="central">Content block</text>
<rect x="298" y="464" width="12" height="12" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#333" x="316" y="473" dominant-baseline="central">Block row</text>
<rect x="428" y="464" width="12" height="12" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="11" fill="#333" x="446" y="473" dominant-baseline="central">Markdown heading</text>
<rect x="618" y="464" width="40" height="8" fill="#c8c7c0"/>
<text font-family="sans-serif" font-size="11" fill="#333" x="664" y="471" dominant-baseline="central">Markdown text</text>
<text font-family="sans-serif" font-size="9" fill="#aaaaaa" x="880" y="520" text-anchor="end">Research Catalogue — editor format comparison</text>
</svg>